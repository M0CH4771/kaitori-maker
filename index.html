<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>買取表ジェネレーター（グリッド版）</title>
    <!-- html2canvasライブラリ（画像化用） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #222;
            --accent-color: #e60012;
            --bg-color: #f4f6f9;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #111;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .control-panel {
            width: 350px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-size: 0.9em;
        }
        input[type="file"], input[type="date"], input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #000;
        }
        .btn-export {
            background-color: var(--accent-color);
        }
        .btn-export:hover {
            background-color: #c00010;
        }

        /* プレビューエリア（画像化される部分） */
        .preview-container {
            flex: 1;
            overflow-x: auto;
        }
        #exportArea {
            background: #fff;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 1100px; /* カード表でよくある横長サイズ */
            margin: 0 auto;
            position: relative;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .logo-container img {
            max-height: 80px;
            max-width: 300px;
            object-fit: contain;
        }
        .title-container h1 {
            margin: 0;
            font-size: 36px;
            color: var(--primary-color);
            text-align: center;
            letter-spacing: 2px;
        }
        
        /* グリッドレイアウト */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6列 */
            gap: 15px;
            margin-bottom: 30px;
        }
        .card-item {
            background: #fff;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .card-item img {
            width: 90%;
            height: auto;
            aspect-ratio: 63/88;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .card-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.6em; /* 2行固定 */
            width: 100%;
        }
        .card-grade {
            background-color: #222;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .card-price {
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        
        .footer-area {
            border-top: 4px solid var(--primary-color);
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .disclaimer {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            line-height: 1.6;
        }
        .update-date {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        @media print {
            .control-panel { display: none; }
            body { background: white; padding: 0; }
            .preview-container { box-shadow: none; overflow: visible; }
            #exportArea { width: 100%; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 左側：コントロールパネル -->
    <div class="control-panel">
        <h2 style="margin-top:0; font-size:1.2em; color:var(--primary-color);">⚙️ 設定パネル</h2>
        
        <div class="control-group">
            <label>1. CSVファイルを読み込む</label>
            <input type="file" id="csvInput" accept=".csv">
        </div>

        <div class="control-group">
            <label>2. ショップロゴ</label>
            <input type="file" id="logoInput" accept="image/*">
        </div>

        <div class="control-group">
            <label>3. タイトル</label>
            <input type="text" id="titleInput" value="PSA10買取表 1">
        </div>

        <div class="control-group">
            <label>4. 更新日</label>
            <input type="date" id="dateInput">
        </div>
        
        <div class="control-group">
            <label>5. 注意書き (フッター)</label>
            <textarea id="disclaimerInput" rows="4">※相場や在庫状況、状態等により価格が変動する場合がございます。
買取枚数が1日の上限に達したカードに関しましては、減額か返却での対応となります。</textarea>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">

        <button onclick="window.print()">🖨️ PDFとして保存（印刷）</button>
        <button class="btn-export" onclick="exportToImage()">📸 画像として書き出し</button>
    </div>

    <!-- 右側：プレビュー＆エクスポートエリア -->
    <div class="preview-container">
        <div id="exportArea">
            <div class="header-area">
                <div class="logo-container">
                    <img id="previewLogo" src="https://via.placeholder.com/300x80?text=Shop+Logo" alt="Shop Logo">
                </div>
                <div class="title-container">
                    <h1 id="previewTitle">PSA10買取表 1</h1>
                </div>
            </div>

            <div id="cardGrid" class="card-grid">
                <!-- ここにカードが生成されます -->
                <div style="grid-column: 1 / -1; padding: 50px; text-align: center; color: #888; font-size: 1.2em;">
                    CSVファイルを読み込むとここにカードが並びます
                </div>
            </div>

            <div class="footer-area">
                <div class="disclaimer" id="previewDisclaimer">
                    ※相場や在庫状況、状態等により価格が変動する場合がございます。<br>
                    買取枚数が1日の上限に達したカードに関しましては、減額か返却での対応となります。
                </div>
                <div class="update-date" id="previewDate">
                    2026/07/24
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 日付の初期設定
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;
    
    // YYYY/MM/DD フォーマットの更新
    function updateDateDisplay(dateStr) {
        const dateObj = new Date(dateStr);
        if(!isNaN(dateObj)) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            document.getElementById('previewDate').innerText = `${y}/${m}/${d}`;
        }
    }
    updateDateDisplay(`${yyyy}-${mm}-${dd}`);

    // 入力イベントリスナー
    document.getElementById('titleInput').addEventListener('input', function(e) {
        document.getElementById('previewTitle').innerText = e.target.value;
    });
    
    document.getElementById('disclaimerInput').addEventListener('input', function(e) {
        document.getElementById('previewDisclaimer').innerHTML = e.target.value.replace(/\n/g, '<br>');
    });

    document.getElementById('dateInput').addEventListener('change', function(e) {
        updateDateDisplay(e.target.value);
    });

    document.getElementById('logoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewLogo').src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('csvInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                parseCSV(e.target.result);
            }
            reader.readAsText(file);
        }
    });

    function parseCSV(text) {
        const lines = text.split('\n');
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = ''; // クリア

        let count = 0;
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            const parts = line.split(',');
            if(parts.length < 10) continue;

            const name = parts[3];
            const type = parts[5]; // PSA10 など
            const imgUrl = parts[parts.length - 1];
            
            // 金額（カンマ対応）
            const price = parts.slice(6, parts.length - 3).join(',');

            const item = document.createElement('div');
            item.className = 'card-item';
            
            // X (Twitter) 等でよく見るカード1枚ごとのレイアウト
            item.innerHTML = `
                <img src="${imgUrl}" crossorigin="anonymous" alt="カード画像">
                <div class="card-name">${name}</div>
                <div><span class="card-grade">${type}</span></div>
                <div class="card-price">${price}</div>
            `;
            grid.appendChild(item);
            count++;
        }
        
        if (count === 0) {
            grid.innerHTML = '<div style="grid-column: 1 / -1; padding: 50px; text-align: center; color: #888;">有効なデータが見つかりませんでした</div>';
        }
    }

    function exportToImage() {
        const exportArea = document.getElementById('exportArea');
        html2canvas(exportArea, {
            useCORS: true,
            allowTaint: true,
            scale: 2
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `買取表_${document.getElementById('dateInput').value}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }).catch(err => {
            alert("画像の生成に失敗しました。\n詳細: " + err);
        });
    }
</script>
</body>
</html>
