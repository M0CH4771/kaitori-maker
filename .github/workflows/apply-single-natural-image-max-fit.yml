name: Apply single natural image max fit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-single-natural-image-max-fit.yml"
      - ".github/patch-single-natural-image-max-fit.py"
      - ".github/test-single-natural-image-max-fit.py"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/patch-single-natural-image-max-fit.py

      - name: Validate source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          Path('/tmp/index-inline.js').write_text('\n'.join(inline),encoding='utf-8')
          assert 'single-natural-aspect-max-fit' in text
          assert 'single-natural-aspect-max-fit-script' in text
          PY
          node --check /tmp/index-inline.js
          git diff --check

      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: Start local server
        run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/single-fit-http.log 2>&1 &

      - name: Test 810 ratio/layout cases
        run: python .github/test-single-natural-image-max-fit.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep single images at natural aspect ratio and max fit"
          git push
