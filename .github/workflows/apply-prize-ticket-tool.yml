name: Apply prize ticket tool

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-prize-ticket-tool.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          patch_path = Path('.github/patch-prize-ticket-tool.py')
          source = patch_path.read_text(encoding='utf-8')
          old = """# 4タブ化
replace_once(
    'grid-template-columns: repeat(3, minmax(0, 1fr));',
    'grid-template-columns: repeat(4, minmax(0, 1fr));',
    'view tabs columns',
)"""
          new = """# 4タブ化
if 'grid-template-columns: repeat(3, minmax(0, 1fr));' not in text:
    raise SystemExit('view tabs grid marker missing')
text = text.replace(
    'grid-template-columns: repeat(3, minmax(0, 1fr));',
    'grid-template-columns: repeat(4, minmax(0, 1fr));',
    1,
)"""
          if old not in source:
              raise SystemExit('Could not locate view-tabs patch block')
          source = source.replace(old, new, 1)
          exec(compile(source, str(patch_path), 'exec'))
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/kaitori-maker-inline.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/kaitori-maker-inline.js
          git diff --check

      - name: Validate ticket markers
        shell: bash
        run: |
          grep -q 'id="ticketMakerView"' index.html
          grep -q 'function exportPrizeTicket()' index.html
          grep -q 'width: 744px;' index.html
          grep -q 'height: 1039px;' index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add prize exchange ticket maker"
          git push
