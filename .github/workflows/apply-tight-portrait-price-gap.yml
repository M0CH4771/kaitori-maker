name: Apply tight portrait price gap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-tight-portrait-price-gap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/patch-tight-portrait-price-gap.py

      - name: Validate JavaScript and CSS markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/kaitori-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/kaitori-inline.js
          grep -q 'id="single-portrait-tight-product-stack"' index.html
          grep -q 'align-items: flex-end !important;' index.html
          grep -q 'single-ad.single-portrait:not(.is-multi) .single-ad-product' index.html
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tighten portrait image and price spacing"
          git push
