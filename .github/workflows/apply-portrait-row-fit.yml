name: Apply portrait row fit fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-portrait-row-fit.yml"

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-portrait-row-fit.py
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Start local server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/layout-http.log 2>&1 &
      - name: Audit all single layouts
        run: python .github/audit-single-layouts.py
      - name: Validate diff
        run: git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix portrait layouts across all item counts"
          git push
