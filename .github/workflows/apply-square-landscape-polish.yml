name: Apply square and landscape single polish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-square-landscape-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/patch-square-landscape-polish.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/kaitori-maker-inline.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/kaitori-maker-inline.js
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish square and landscape single announcement layouts"
          git push
