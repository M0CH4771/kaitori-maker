name: Apply single status filter

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-single-status-filter.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/patch-single-status-filter.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/kaitori-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/kaitori-inline.js
          git diff --check

      - name: Validate filter markers
        shell: bash
        run: |
          grep -q '<option value="strengthened">強化</option>' index.html
          grep -q '<option value="super-strengthened">超強化</option>' index.html
          grep -q '<option value="listed">掲載</option>' index.html
          grep -q 'return status === "強化";' index.html
          grep -q 'return status === "超強化";' index.html
          grep -q 'return status === "掲載";' index.html
          ! grep -q '<option value="not-strengthened">強化以外</option>' index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Split strengthened single status filters"
          git push
