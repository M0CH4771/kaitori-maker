name: Apply adaptive single layouts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-auto-single-layouts.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/patch-auto-single-layouts.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/kaitori-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/kaitori-inline.js
          git diff --check

      - name: Validate adaptive layouts
        shell: bash
        run: |
          grep -q '22:\[8,3\]' index.html
          grep -q '30:\[10,3\]' index.html
          grep -q '22:\[6,4\]' index.html
          grep -q '29:\[8,4\]' index.html
          grep -q 'getBalancedSingleRowCounts' index.html
          grep -q 'id="single-layout-auto-optimizer"' index.html
          grep -q 'margin-top: 0 !important' index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize single layouts for every item count"
          git push
