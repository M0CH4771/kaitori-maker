name: Patch single announcement to 30 items

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-single-announcement-30.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply single announcement patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              text = text.replace(old, new, 1)

          def replace_count(old, new, expected, label):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, got {count}")
              text = text.replace(old, new)

          def replace_regex(pattern, replacement, label, flags=re.S):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")

          replace_once(
              'const SINGLE_SIZES = ["square", "portrait", "landscape"];\n    const DEFAULT_SINGLE_HEADLINE_SCALE = 100;',
              'const SINGLE_SIZES = ["square", "portrait", "landscape"];\n    const MAX_SINGLE_ITEMS_PER_IMAGE = 30;\n    const DEFAULT_SINGLE_HEADLINE_SCALE = 100;',
              "single max constant"
          )

          replace_once(
              '<small>1〜10商品</small>',
              '<small>1〜30商品</small>',
              "single tab range"
          )
          replace_once(
              '<p>1枚に<strong>1〜10商品</strong>を配置できます</p>',
              '<p>1枚に<strong>1〜30商品</strong>を配置できます</p>',
              "single panel range"
          )

          replace_once(
              '''                            <option value="9">9商品</option>\n                            <option value="10">10商品</option>\n                        </select>''',
              '''                            <option value="9">9商品</option>\n                            <option value="10">10商品</option>\n                            <optgroup label="高密度レイアウト">\n                                <option value="11">11商品</option>\n                                <option value="12">12商品</option>\n                                <option value="13">13商品</option>\n                                <option value="14">14商品</option>\n                                <option value="15">15商品</option>\n                                <option value="16">16商品</option>\n                                <option value="17">17商品</option>\n                                <option value="18">18商品</option>\n                                <option value="19">19商品</option>\n                                <option value="20">20商品</option>\n                                <option value="21">21商品</option>\n                                <option value="22">22商品</option>\n                                <option value="23">23商品</option>\n                                <option value="24">24商品</option>\n                                <option value="25">25商品</option>\n                                <option value="26">26商品</option>\n                                <option value="27">27商品</option>\n                                <option value="28">28商品</option>\n                                <option value="29">29商品</option>\n                                <option value="30">30商品</option>\n                            </optgroup>\n                        </select>''',
              "single item count options"
          )

          replace_once(
              '''                    <input\n                        type="text"\n                        id="singleSearchInput"\n                        placeholder="カード名・種別・掲載グループで検索"\n                        aria-label="単品告知に使用する商品を検索"\n                    >\n                    <button class="btn-soft" type="button" onclick="selectVisibleSingleCards()">表示中の商品を選択</button>''',
              '''                    <input\n                        type="text"\n                        id="singleSearchInput"\n                        placeholder="カード名・種別・掲載グループ・掲載状況で検索"\n                        aria-label="単品告知に使用する商品を検索"\n                    >\n                    <select\n                        id="singleStatusFilterSelect"\n                        aria-label="掲載状況で絞り込み"\n                    >\n                        <option value="all">掲載状況：すべて</option>\n                        <option value="strengthened">強化のみ</option>\n                        <option value="not-strengthened">強化以外</option>\n                    </select>\n                    <button class="btn-soft" type="button" onclick="selectVisibleSingleCards()">表示中の商品を選択</button>''',
              "single status filter UI"
          )

          replace_count(
              '''Math.min(\n            10,\n            Math.max(1, Number(document.getElementById("singleItemsPerImageSelect")?.value) || 1)\n        )''',
              '''Math.min(\n            MAX_SINGLE_ITEMS_PER_IMAGE,\n            Math.max(1, Number(document.getElementById("singleItemsPerImageSelect")?.value) || 1)\n        )''',
              2,
              "single count clamps"
          )
          replace_once(
              'String(Math.min(10, Math.max(1, Number(settings.itemsPerImage) || 1)));',
              'String(Math.min(MAX_SINGLE_ITEMS_PER_IMAGE, Math.max(1, Number(settings.itemsPerImage) || 1)));',
              "single restored count clamp"
          )

          replace_regex(
              r'''    function getSingleMultiLayout\(size, count\) \{.*?\n    \}\n\n    function renderSingleProductRows''',
              '''    function getSingleMultiLayout(size, count) {\n        const safeCount = Math.min(\n            MAX_SINGLE_ITEMS_PER_IMAGE,\n            Math.max(2, Number(count) || 2)\n        );\n        const legacyLayoutMap = {\n            square: {\n                2: [2, 1], 3: [3, 1], 4: [2, 2], 5: [3, 2],\n                6: [3, 2], 7: [4, 2], 8: [4, 2], 9: [5, 2], 10: [5, 2]\n            },\n            portrait: {\n                2: [2, 1], 3: [3, 1], 4: [2, 2], 5: [3, 2],\n                6: [3, 2], 7: [4, 2], 8: [4, 2], 9: [5, 2], 10: [5, 2]\n            },\n            landscape: {\n                2: [2, 1], 3: [3, 1], 4: [4, 1], 5: [5, 1],\n                6: [3, 2], 7: [4, 2], 8: [4, 2], 9: [5, 2], 10: [5, 2]\n            }\n        };\n        const normalizedSize = SINGLE_SIZES.includes(size) ? size : "square";\n        let columns;\n        let rows;\n\n        if (safeCount <= 10) {\n            [columns, rows] = legacyLayoutMap[normalizedSize][safeCount];\n        } else if (normalizedSize === "portrait") {\n            if (safeCount <= 12) [columns, rows] = [3, 4];\n            else if (safeCount <= 15) [columns, rows] = [3, 5];\n            else if (safeCount <= 20) [columns, rows] = [4, 5];\n            else if (safeCount <= 24) [columns, rows] = [4, 6];\n            else [columns, rows] = [5, 6];\n        } else if (normalizedSize === "landscape") {\n            if (safeCount <= 12) [columns, rows] = [6, 2];\n            else if (safeCount <= 15) [columns, rows] = [5, 3];\n            else if (safeCount <= 18) [columns, rows] = [6, 3];\n            else if (safeCount <= 20) [columns, rows] = [5, 4];\n            else if (safeCount <= 24) [columns, rows] = [6, 4];\n            else if (safeCount === 25) [columns, rows] = [5, 5];\n            else [columns, rows] = [6, 5];\n        } else {\n            if (safeCount <= 12) [columns, rows] = [4, 3];\n            else if (safeCount <= 15) [columns, rows] = [5, 3];\n            else if (safeCount === 16) [columns, rows] = [4, 4];\n            else if (safeCount <= 20) [columns, rows] = [5, 4];\n            else if (safeCount <= 24) [columns, rows] = [6, 4];\n            else if (safeCount === 25) [columns, rows] = [5, 5];\n            else [columns, rows] = [6, 5];\n        }\n\n        const density = safeCount >= 21\n            ? "micro"\n            : safeCount >= 13\n                ? "ultra"\n                : safeCount >= 9\n                    ? "dense"\n                    : safeCount >= 7 ||\n                      (normalizedSize === "landscape" && safeCount >= 4)\n                        ? "compact"\n                        : "comfortable";\n        const gap = density === "micro"\n            ? 5\n            : density === "ultra"\n                ? 8\n                : density === "dense"\n                    ? 12\n                    : density === "compact"\n                        ? 14\n                        : 18;\n        const totalColumnGap = Math.max(0, columns - 1) * gap;\n\n        return {\n            columns,\n            rows,\n            density,\n            gap,\n            rowGap: gap,\n            cardWidth: `calc((100% - ${totalColumnGap}px) / ${columns})`\n        };\n    }\n\n    function renderSingleProductRows''',
              "single layouts 11-30"
          )

          replace_regex(
              r'''    function getSingleHeadlineSize\(settings, isMulti, density\) \{.*?\n    \}\n\n    function getSingleProductNameSize\(settings, isMulti, density, size\) \{.*?\n    \}\n\n    function getSinglePriceSize\(settings, isMulti, density, size\) \{.*?\n    \}\n\n    function getSingleAdAreas''',
              '''    function getSingleHeadlineSize(settings, isMulti, density) {\n        let baseSize = settings.design === "mono" ? 64 : 57;\n        if (isMulti) {\n            baseSize = density === "micro"\n                ? 22\n                : density === "ultra"\n                    ? 28\n                    : density === "dense"\n                        ? 34\n                        : density === "compact"\n                            ? 38\n                            : 42;\n        }\n        const scale = clampTitleNumber(\n            settings.headlineScale,\n            60,\n            160,\n            DEFAULT_SINGLE_HEADLINE_SCALE\n        );\n        return Math.round(baseSize * scale) / 100;\n    }\n\n    function getSingleProductNameSize(settings, isMulti, density, size) {\n        let baseSize = size === "portrait" ? 34 : 39;\n        if (isMulti) {\n            baseSize = density === "micro"\n                ? 10\n                : density === "ultra"\n                    ? 13\n                    : density === "dense"\n                        ? 16\n                        : density === "compact"\n                            ? 18\n                            : 21;\n        }\n        const scale = clampTitleNumber(\n            settings.nameScale,\n            60,\n            160,\n            DEFAULT_SINGLE_NAME_SCALE\n        );\n        return Math.round(baseSize * scale) / 100;\n    }\n\n    function getSinglePriceSize(settings, isMulti, density, size) {\n        let baseSize = size === "portrait"\n            ? 61\n            : settings.design === "redimpact"\n                ? 78\n                : 72;\n        if (isMulti) {\n            baseSize = density === "micro"\n                ? 14\n                : density === "ultra"\n                    ? 18\n                    : density === "dense"\n                        ? 24\n                        : density === "compact"\n                            ? 27\n                            : 31;\n        }\n        const scale = clampTitleNumber(\n            settings.priceScale,\n            60,\n            160,\n            DEFAULT_SINGLE_PRICE_SCALE\n        );\n        const hiddenNameBoost = settings.nameDisplay === "hide"\n            ? isMulti\n                ? density === "micro"\n                    ? 1.06\n                    : density === "ultra"\n                        ? 1.12\n                        : density === "dense"\n                            ? 1.22\n                            : density === "compact"\n                                ? 1.28\n                                : 1.34\n                : 1.4\n            : 1;\n        return Math.round(baseSize * scale * hiddenNameBoost) / 100;\n    }\n\n    function getSingleAdAreas''',
              "single high density typography"
          )

          replace_regex(
              r'''    function getFilteredSingleCards\(\) \{.*?\n    \}\n\n    function renderSingleCardPicker''',
              '''    function refreshSingleStatusFilterOptions() {\n        const select = document.getElementById("singleStatusFilterSelect");\n        if (!select) return;\n\n        const currentValue = select.value || "all";\n        const statuses = Array.from(new Set(\n            globalCardData\n                .map(card => String(card.status || "").trim())\n                .filter(Boolean)\n        )).sort((a, b) => a.localeCompare(b, "ja", {\n            numeric: true,\n            sensitivity: "base"\n        }));\n        const options = [\n            ["all", "掲載状況：すべて"],\n            ["strengthened", "強化のみ"],\n            ["not-strengthened", "強化以外"],\n            ...statuses.map(status => [\n                `status:${status}`,\n                `掲載「${status}」だけ`\n            ])\n        ];\n        if (globalCardData.some(card => !String(card.status || "").trim())) {\n            options.push(["status:", "掲載状況：空欄だけ"]);\n        }\n\n        select.innerHTML = "";\n        options.forEach(([value, label]) => {\n            const option = document.createElement("option");\n            option.value = value;\n            option.textContent = label;\n            select.appendChild(option);\n        });\n        select.value = options.some(([value]) => value === currentValue)\n            ? currentValue\n            : "all";\n    }\n\n    function getFilteredSingleCards() {\n        const query = String(\n            document.getElementById("singleSearchInput")?.value || ""\n        ).trim().toLocaleLowerCase("ja");\n        const statusFilter = String(\n            document.getElementById("singleStatusFilterSelect")?.value || "all"\n        );\n\n        return globalCardData.filter(card => {\n            const status = String(card.status || "").trim();\n            const matchesStatus = statusFilter === "all"\n                ? true\n                : statusFilter === "strengthened"\n                    ? status.includes("強化")\n                    : statusFilter === "not-strengthened"\n                        ? !status.includes("強化")\n                        : statusFilter.startsWith("status:")\n                            ? status === statusFilter.slice("status:".length)\n                            : true;\n            if (!matchesStatus) return false;\n            if (!query) return true;\n\n            return [\n                card.name,\n                card.type,\n                card.group,\n                card.status,\n                card.price,\n                card.aMinusPrice,\n                card.productId\n            ].some(value =>\n                String(value || "")\n                    .toLocaleLowerCase("ja")\n                    .includes(query)\n            );\n        });\n    }\n\n    function renderSingleCardPicker''',
              "single status filtering"
          )

          replace_once(
              '''        const filteredCards = getFilteredSingleCards();\n        count.textContent =''',
              '''        refreshSingleStatusFilterOptions();\n        const filteredCards = getFilteredSingleCards();\n        count.textContent =''',
              "refresh single status options"
          )

          replace_once(
              '''    document.getElementById("singleSearchInput")\n        .addEventListener("input", () => {\n            singlePickerPage = 1;\n            renderSingleCardPicker();\n        });''',
              '''    document.getElementById("singleSearchInput")\n        .addEventListener("input", () => {\n            singlePickerPage = 1;\n            renderSingleCardPicker();\n        });\n\n    document.getElementById("singleStatusFilterSelect")\n        .addEventListener("change", () => {\n            singlePickerPage = 1;\n            renderSingleCardPicker();\n        });''',
              "single status filter listener"
          )

          dense_css = r'''

        /* ===== 単品告知：11〜30商品用の高密度レイアウト ===== */
        .single-ad.is-multi[data-density="ultra"] {
            padding: 22px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-header {
            min-height: 52px;
            padding-bottom: 5px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-logo-box {
            width: 190px;
            height: 52px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-logo {
            max-height: 50px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-date {
            font-size: 11px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-heading {
            margin-top: 6px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-products {
            margin-top: 7px;
            padding: 1px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card {
            padding: 1px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card .single-ad-info {
            margin-top: 3px;
            padding: 3px 4px 4px;
            border-width: 1px !important;
            border-radius: 7px;
            box-shadow: 0 2px 0 rgba(0,0,0,.16) !important;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card .single-ad-card-name {
            line-height: 1.08;
            -webkit-line-clamp: 1;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card .single-ad-grade {
            margin-top: 2px;
            padding: 1px 5px;
            font-size: 8px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card .single-ad-price-label {
            margin-top: 2px;
            font-size: 8px;
            letter-spacing: .03em;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card .single-ad-price {
            min-height: 32px;
            margin-top: 2px;
            padding: 2px 3px;
            border-width: 1px;
            border-radius: 5px;
            box-shadow: 0 2px 0 rgba(0,0,0,.2);
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-product-card .single-ad-price.is-dual {
            min-height: 38px;
            padding: 1px 2px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-price-row {
            gap: 2px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-state-label {
            max-width: 38px;
            font-size: 8px;
        }

        .single-ad.is-multi[data-density="ultra"] .single-ad-price-label .price-change-badge {
            padding: 2px 4px;
            font-size: 8px;
        }

        .single-ad.is-multi.hide-card-name[data-density="ultra"] .single-ad-product-card .single-ad-info {
            padding: 3px;
        }

        .single-ad.is-multi.hide-card-name[data-density="ultra"] .single-ad-product-card .single-ad-grade {
            margin-bottom: 2px;
        }

        .single-ad.is-multi.hide-card-name[data-density="ultra"] .single-ad-product-card .single-ad-price-label {
            font-size: 8px;
        }

        .single-ad.is-multi.hide-card-name[data-density="ultra"] .single-ad-product-card .single-ad-price {
            min-height: 38px;
            margin-top: 3px;
        }

        .single-ad.is-multi.hide-card-name[data-density="ultra"] .single-ad-product-card .single-ad-price.is-dual {
            min-height: 46px;
        }

        .single-ad.is-multi[data-density="micro"] {
            padding: 14px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-header {
            min-height: 42px;
            padding-bottom: 3px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-logo-box {
            width: 150px;
            height: 42px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-logo {
            max-height: 40px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-date {
            font-size: 9px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-heading {
            margin-top: 3px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-products {
            margin-top: 4px;
            padding: 0;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card {
            padding: 0;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-image-stage {
            padding: 0 1px 1px !important;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-info {
            margin-top: 2px;
            padding: 2px 2px 3px;
            border-width: 1px !important;
            border-radius: 5px;
            box-shadow: 0 1px 0 rgba(0,0,0,.16) !important;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-card-name {
            line-height: 1.02;
            -webkit-line-clamp: 1;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-grade {
            margin-top: 1px;
            padding: 1px 3px;
            font-size: 7px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-price-label {
            margin-top: 1px;
            font-size: 7px;
            letter-spacing: 0;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-price {
            min-height: 24px;
            margin-top: 1px;
            padding: 1px 2px;
            border-width: 1px;
            border-radius: 4px;
            box-shadow: 0 1px 0 rgba(0,0,0,.2);
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-product-card .single-ad-price.is-dual {
            min-height: 30px;
            padding: 1px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-price-row {
            gap: 1px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-state-label {
            max-width: 30px;
            font-size: 7px;
        }

        .single-ad.is-multi[data-density="micro"] .single-ad-price-label .price-change-badge {
            padding: 1px 3px;
            font-size: 7px;
        }

        .single-ad.is-multi.hide-card-name[data-density="micro"] .single-ad-product-card .single-ad-info {
            padding: 2px;
        }

        .single-ad.is-multi.hide-card-name[data-density="micro"] .single-ad-product-card .single-ad-grade {
            margin-bottom: 1px;
        }

        .single-ad.is-multi.hide-card-name[data-density="micro"] .single-ad-product-card .single-ad-price-label {
            font-size: 7px;
        }

        .single-ad.is-multi.hide-card-name[data-density="micro"] .single-ad-product-card .single-ad-price {
            min-height: 27px;
            margin-top: 2px;
        }

        .single-ad.is-multi.hide-card-name[data-density="micro"] .single-ad-product-card .single-ad-price.is-dual {
            min-height: 34px;
        }

        /* 単品候補：検索 + 掲載状況フィルタ + 一括選択 */
        .single-maker .single-selection-toolbar {
            grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .single-maker #singleSearchInput {
            grid-column: 1 / 5;
        }

        .single-maker #singleStatusFilterSelect {
            grid-column: 5 / 7;
            width: 100%;
            min-width: 0;
        }

        .single-maker .single-selection-toolbar button {
            grid-column: span 2;
            width: 100%;
            min-width: 0;
        }

        @media (max-width: 680px) {
            .single-maker #singleSearchInput,
            .single-maker #singleStatusFilterSelect,
            .single-maker .single-selection-toolbar button {
                grid-column: 1 / -1;
                width: 100%;
            }
        }
'''
          replace_once(
              "\n    </style>\n</head>",
              dense_css + "\n    </style>\n</head>",
              "single dense CSS"
          )

          required = [
              'MAX_SINGLE_ITEMS_PER_IMAGE = 30',
              '<small>1〜30商品</small>',
              '<option value="30">30商品</option>',
              'id="singleStatusFilterSelect"',
              'data-density="micro"',
              'data-density="ultra"',
              '掲載「${status}」だけ'
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"validation missing: {needle}")

          if 'String(Math.min(10, Math.max(1, Number(settings.itemsPerImage)' in text:
              raise SystemExit("old single 10-item restore clamp still exists")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/kaitori-maker-inline.js").write_text(inline[-1], encoding="utf-8")
          print("Patched index.html:", len(text), "chars")
          PY
          node --check /tmp/kaitori-maker-inline.js
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand single announcements to 30 items"
          git push
