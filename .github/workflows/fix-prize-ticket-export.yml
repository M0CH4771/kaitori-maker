name: Harden prize ticket export

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-prize-ticket-export.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix-prize-ticket-export.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/kaitori-maker-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/kaitori-maker-inline.js
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden prize ticket PNG export"
          git push
