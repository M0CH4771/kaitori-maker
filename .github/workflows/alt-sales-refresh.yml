name: Refresh ALT sales

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'alt-sales-search/scripts/collect-alt.mjs'
      - 'alt-sales-search/scripts/parse-alt.mjs'
      - 'alt-sales-search/scripts/targets.json'
      - 'alt-sales-search/package.json'
      - 'alt-sales-search/package-lock.json'
      - '.github/workflows/alt-sales-refresh.yml'

permissions:
  contents: write

concurrency:
  group: alt-sales-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: alt-sales-search/package-lock.json
      - name: Install collector
        working-directory: alt-sales-search
        run: npm ci
      - name: Validate parsers and search
        working-directory: alt-sales-search
        run: npm test
      - name: Install browser
        working-directory: alt-sales-search
        run: npx playwright install --with-deps chromium
      - name: Collect public transaction history
        working-directory: alt-sales-search
        run: npm run collect
      - name: Save transaction snapshot
        run: |
          git add -- alt-sales-search/dist/data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh ALT public transaction history'
          git push
