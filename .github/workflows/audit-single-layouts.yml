name: Audit all single layouts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-single-layouts.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Start local server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/layout-http.log 2>&1 &
          echo $! > /tmp/layout-http.pid
      - name: Run exhaustive audit
        continue-on-error: true
        run: python .github/audit-single-layouts.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: single-layout-audit
          path: layout-audit.json
          if-no-files-found: error
