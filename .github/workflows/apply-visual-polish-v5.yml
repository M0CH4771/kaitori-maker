name: Apply visual polish v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-visual-polish-v5.yml"

permissions:
  contents: write

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Apply polish patch
        run: python .github/patch-visual-polish-v5b.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline: raise SystemExit('no inline script')
          Path('/tmp/kaitori-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/kaitori-inline.js
          git diff --check

      - name: Install visual audit dependencies
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install chromium

      - name: Start local server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/visual-polish-http.log 2>&1 &

      - name: Run full visual audit
        run: python .github/full-visual-audit.py

      - name: Require zero layout overlaps or overflows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('visual-audit/audit-results.json').read_text(encoding='utf-8'))
          failures=[]
          for kind in ('buy','single'):
              for rec in data[kind]:
                  bad=[m.get('issues',[]) for m in rec.get('measure',[]) if m.get('issues')]
                  if bad:
                      identity={k:v for k,v in rec.items() if k!='measure'}
                      failures.append({'kind':kind, **identity, 'issues':bad})
          print('true layout failures:', len(failures))
          if failures:
              print(json.dumps(failures[:40],ensure_ascii=False,indent=2))
              raise SystemExit(2)
          PY

      - name: Upload post-polish audit
        uses: actions/upload-artifact@v4
        with:
          name: visual-polish-v5-audit
          path: visual-audit
          if-no-files-found: error

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish buylist and single announcement layouts"
          git push
