name: Apply visual polish v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-visual-polish-v5.yml"

permissions:
  contents: write

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply polish patch
        run: python .github/patch-visual-polish-v5b.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline: raise SystemExit('no inline script')
          Path('/tmp/kaitori-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/kaitori-inline.js
          git diff --check

      - name: Install audit dependencies
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: Start local server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/visual-polish-http.log 2>&1 &

      - name: Audit all 2280 geometry cases
        run: python .github/quick-geometry-audit.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish buylist and single announcement layouts"
          git push
