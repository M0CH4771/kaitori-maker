name: Visual contact audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/visual-contact-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install chromium
      - name: Start server
        run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/contact-http.log 2>&1 &
      - name: Build contact sheets
        run: python .github/visual-contact-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: visual-contact-audit
          path: visual-contact
          if-no-files-found: error
