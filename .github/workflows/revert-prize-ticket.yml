name: Revert prize ticket feature

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/revert-prize-ticket.yml"

permissions:
  contents: write

jobs:
  revert-ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore pre-ticket index
        shell: bash
        run: |
          git fetch origin 8f08c1c749755c401e28ca935f3660c96ea0ab34 --depth=1
          git show 8f08c1c749755c401e28ca935f3660c96ea0ab34:index.html > index.html

      - name: Validate restored JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/kaitori-maker-inline.js').write_text(inline[-1], encoding='utf-8')
          if 'ticketMakerView' in text or 'exportPrizeTicket' in text:
              raise SystemExit('Prize ticket markers still present')
          PY
          node --check /tmp/kaitori-maker-inline.js
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove prize exchange ticket maker"
          git push
